name: NODE/01 pruebas web

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --no-save --no-package-lock playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Preparar Bootstrap para los dobles de navegador
        run: |
          mkdir -p .local
          curl --fail --silent --show-error --location "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" --output .local/bootstrap-5.3.3.min.css
      - run: npm test
      - run: npm run test:browser
      - run: npm run test:platform43
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-navegador-local
          path: |
            evidencias/definitivo/simulacion/
            entregables/practica-4.3/evidencias/browser-local/
